name: CI

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"

defaults:
  run:
    working-directory: app

jobs:
  build:
    name: typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      # Dummy values, not real secrets — next build only needs env vars to
      # satisfy src/lib/env.ts's validation, it never actually calls out
      # to Supabase/Postmark/etc. at build time (every data-fetching route
      # here is dynamic, not statically generated).
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          APP_SIGNING_SECRET: ci-placeholder-signing-secret-32-chars-min
          POSTMARK_SERVER_TOKEN: ci-placeholder
          POSTMARK_INBOUND_WEBHOOK_SECRET: ci-placeholder
          POSTMARK_FROM_ADDRESS: ci@example.org
